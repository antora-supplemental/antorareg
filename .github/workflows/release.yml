name: Release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
permissions:
  contents: read
jobs:
  build:
    if: ${{ !contains(github.ref_name, '+') }}
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest,   target: windows-x64,   ext: .exe }
          - { os: windows-11-arm,   target: windows-arm64, ext: .exe }
          - { os: ubuntu-latest,    target: linux-x64,     ext: "" }
          - { os: ubuntu-24.04-arm, target: linux-arm64,   ext: "" }
          - { os: macos-14,         target: macos-arm64,   ext: "" }
    defaults:
      run:
        shell: bash
        working-directory: src/antora-supplemental/antorareg
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: src/antora-supplemental/antorareg
      - uses: actions/checkout@v7.0.1
        with:
          repository: dlang-supplemental/yaml-edit-d
          path: src/dlang-supplemental/yaml-edit-d
      - uses: dlang-community/setup-dlang@v1.4.0
        with:
          compiler: ldc-latest
      - name: Test
        run: dub test --compiler=ldc2
      - name: Build
        run: dub build --compiler=ldc2 -b release
      - name: Check version matches the tag
        run: |
          v=$(./bin/antorareg${{ matrix.ext }} --version | head -1 | cut -d' ' -f2)
          [ "v$v" = "${{ github.ref_name }}" ] || { echo "::error::binary says $v, tag is ${{ github.ref_name }}"; exit 1; }
      - name: Stage asset
        run: mkdir -p ../../../dist && cp bin/antorareg${{ matrix.ext }} ../../../dist/antorareg-${{ matrix.target }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: antorareg-${{ matrix.target }}
          path: dist/antorareg-${{ matrix.target }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum antorareg-* > SHA256SUMS && cat SHA256SUMS
      - name: Immutable release
        run: |
          v=${TAG#v}
          notes=$(awk -v t="$v" 'f && /^== /{exit} index($0, "== ") == 1 && index($0, t) {f=1} f' docs/modules/ROOT/pages/changelog.adoc)
          gh release create "$TAG" dist/* --title "$v+antora.3" --notes "${notes:-Release $TAG}" --latest
      - name: Move rolling aliases
        run: |
          v=${TAG#v}; major=${v%%.*}; rest=${v#*.}; minor=${rest%%.*}
          sha=$GITHUB_SHA
          for alias in "v$major" "v$major.$minor"; do
            gh release delete "$alias" --yes --cleanup-tag 2>/dev/null || true
            git push origin ":refs/tags/$alias" 2>/dev/null || true
            gh release create "$alias" dist/* --target "$sha" --title "$alias (rolling → $v+antora.3)" --prerelease --latest=false \
              --notes "Rolling alias for the newest ${alias#v}.x release (currently $v+antora.3, tag $TAG). Updated on every release in this line. Use \`uses: antora-supplemental/antorareg@$alias\` or \`releases/download/$alias/<asset>\`."
          done

  action:
    needs: release
    name: action @v0 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run the released action
        id: ar
        uses: antora-supplemental/antorareg@v0
        with:
          playbook: tests/fixtures/action/antora-playbook.yml
      - name: The binary was downloaded, not built
        shell: bash
        run: |
          echo "binary: ${{ steps.ar.outputs.binary }}"
          case '${{ steps.ar.outputs.binary }}' in *antorareg-bin*) ;; *) echo "::error::action built from source"; exit 1;; esac
          "${{ steps.ar.outputs.binary }}" --version
